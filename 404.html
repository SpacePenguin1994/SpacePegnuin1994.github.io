<!-- Collapse toggle for abstracts and intros -->
<script>
$(document).on('click', '.abstract-toggle', function(e) {
    e.preventDefault();
    var target = $(this).data('target');
    var $body = $(target);
    var $link = $(this);
    if ($body.hasClass('show')) {
        $body.removeClass('show');
        $link.text('Abstract');
    } else {
        $body.addClass('show');
        $link.text('Hide Abstract');
    }
});

$(document).on('click', '.intro-toggle', function(e) {
    e.preventDefault();
    var target = $(this).data('target');
    var $body = $(target);
    var $link = $(this);
    if ($body.hasClass('show')) {
        $body.removeClass('show');
        $link.text('Introduction');
    } else {
        $body.addClass('show');
        $link.text('Hide Introduction');
    }
});
</script>
